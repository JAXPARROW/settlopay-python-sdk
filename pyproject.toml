[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "settlo-pay-python-sdk"
dynamic = ["version"]
description = "Typed sync + async Python SDK for the Settlo Pay API (payments, payouts, refunds, webhooks)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "JAXPARROW" }]
keywords = ["settlo", "settlo-pay", "payments", "mobile-money", "tanzania", "payouts", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3",
]

[project.urls]
Homepage = "https://settlopay.co.tz"
Documentation = "https://settlopay.co.tz/docs"
Repository = "https://github.com/JAXPARROW/settlopay-python-sdk"
Issues = "https://github.com/JAXPARROW/settlopay-python-sdk/issues"
Changelog = "https://github.com/JAXPARROW/settlopay-python-sdk/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.22",
]
lint = [
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit[toml]>=1.8",
    "pip-audit>=2.7",
]
release = [
    "build>=1.2",
    "twine>=6",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "release" },
    "pre-commit>=4",
]

[tool.hatch.version]
path = "src/settlopay/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/settlopay"]

[tool.hatch.build.targets.sdist]
include = [
    "src/settlopay",
    "tests",
    "README.md",
    "documentation.md",
    "SECURITY.md",
    "CHANGELOG.md",
    "LICENSE",
]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not live"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: hits the real Settlo Pay API (needs SETTLO_API_KEY and SETTLO_RUN_LIVE=1)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["settlopay"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "N", "C4", "SIM", "PT", "RUF", "ASYNC", "PIE", "RET",
]
ignore = [
    "RET505", # else-after-return reads fine in validation code
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PT011"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- bandit
[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
