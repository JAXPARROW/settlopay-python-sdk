# Install once:  pre-commit install
# Run on demand: pre-commit run --all-files
minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -q]
        additional_dependencies: ["bandit[toml]"]
        files: ^src/

  - repo: https://github.com/pypa/pip-audit
    rev: v2.10.1
    hooks:
      # Audits the project's declared runtime dependencies (resolved fresh), not the hook venv.
      - id: pip-audit
        args: [--strict, --progress-spinner=off, "."]
        stages: [pre-push, manual]
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        name: mypy (strict)
        args: []  # config (strict, files) comes from pyproject.toml
        pass_filenames: false
        additional_dependencies:
          - "httpx>=0.27,<1.0"
          - "pydantic>=2.7,<3"
          - "pytest>=8.3"
          - "pytest-asyncio>=0.24"
          - "respx>=0.22"
